<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://onedrive.live.com https://1drv.ms https://*.officeapps.live.com https://*.sharepoint.com; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>播放簡報 · TeachingHub</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/player.css" />
    <script src="assets/js/theme.js"></script>
    <script type="module" src="assets/js/player.js"></script>
  </head>
  <body class="player">
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" /></symbol>
    </svg>

    <header class="bar">
      <a class="btn" id="back" href="index.html">
        <svg class="icon"><use href="#i-back" /></svg><span>返回列表</span>
      </a>
      <h1 class="bar-title" id="title">載入中…</h1>
      <div class="bar-actions">
        <button type="button" class="btn" id="reload" hidden>
          <svg class="icon"><use href="#i-reload" /></svg><span>重新載入</span>
        </button>
        <button type="button" class="btn btn-primary" id="fullscreen" hidden>
          <svg class="icon"><use href="#i-full" /></svg><span>全螢幕</span>
        </button>
        <a class="btn" id="open" target="_blank" rel="noopener noreferrer" hidden>
          <svg class="icon"><use href="#i-external" /></svg><span>網頁版開啟</span>
        </a>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="切換外觀">
          <svg class="icon"><use href="#i-theme" /></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="overlay" id="loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>正在載入簡報…</p>
        <p class="slow" id="slow" hidden>載入比平常久。可以按「重新載入」，或改用「網頁版開啟」。</p>
      </div>
      <p class="fs-hint" id="fs-hint" hidden>先點一下投影片，簡報筆就能翻頁 · 按 Esc 離開全螢幕</p>
      <div class="overlay error" id="error" role="alert" hidden>
        <p class="error-title" id="error-title">無法播放</p>
        <p id="error-text"></p>
        <a class="btn btn-primary" href="index.html">返回簡報列表</a>
      </div>
    </main>

    <p class="tips" id="tips">
      先用滑鼠點一下投影片，鍵盤方向鍵與簡報筆才能翻頁。全螢幕時按 Esc 離開。改過 PPT 後按「重新載入」取得最新版本。
    </p>
  </body>
</html>
