<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TeachingHub 教學簡報</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <script src="assets/js/theme.js"></script>
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" /></symbol>
    </svg>

    <header class="site-header">
      <div class="wrap">
        <div class="brand">
          <h1>TeachingHub</h1>
          <p>教學簡報工作站</p>
        </div>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="切換外觀">
          <svg class="icon"><use href="#i-theme" /></svg>
        </button>
      </div>
    </header>

    <main class="wrap" id="app">
      <nav aria-label="科目">
        <ul class="subjects" id="subjects"></ul>
      </nav>

      <form class="filters" id="filters" role="search">
        <div class="field">
          <label for="f-grade">年級</label>
          <select id="f-grade"></select>
        </div>
        <div class="field">
          <label for="f-volume">冊別</label>
          <select id="f-volume"></select>
        </div>
        <div class="field">
          <label for="f-chapter">章節</label>
          <select id="f-chapter"></select>
        </div>
        <div class="field search">
          <label for="f-q">搜尋簡報</label>
          <input id="f-q" type="search" placeholder="輸入名稱、章節或關鍵字" autocomplete="off" enterkeyhint="search" />
        </div>
        <button type="button" class="btn" id="f-clear">清除條件</button>
      </form>

      <p class="result-meta" id="result-meta" aria-live="polite">正在載入簡報清單…</p>
      <ul class="grid" id="grid"></ul>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>本站是公開網頁，只放已主動分享的單一簡報連結。在教室電腦上請用無痕視窗，不要登入任何個人帳號，下課後關閉所有無痕視窗。</p>
        <p>修改 PowerPoint 並存回 OneDrive 後，播放頁按「重新載入」即可看到新版本。</p>
      </div>
    </footer>
  </body>
</html>
